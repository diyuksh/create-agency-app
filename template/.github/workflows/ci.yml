name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - run: bun install
    - run: bun run lint
    - run: bunx tsc --noEmit
    - name: Build Next.js
      run: bun run build
    - name: Install Playwright
      run: bunx playwright install --with-deps
    - name: Run E2E Tests
      run: bun run test:e2e
