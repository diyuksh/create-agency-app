name: Release Go CLI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -o build/create-agency-app-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -o build/create-agency-app-linux-arm64 main.go
          GOOS=darwin GOARCH=amd64 go build -o build/create-agency-app-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -o build/create-agency-app-darwin-arm64 main.go
          GOOS=windows GOARCH=amd64 go build -o build/create-agency-app-windows-amd64.exe main.go

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/create-agency-app-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
