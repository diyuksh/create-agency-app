version: 2
project_name: template.sar.ga

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./main.go

archives:
  - format: binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

brews:
  - repository:
      owner: diyuksh
      name: homebrew-tap
    description: "CLI to scaffold a high-end SAR.GA template"
    homepage: "https://template.sar.ga"
    test: |
      system "#{bin}/template.sar.ga version"
