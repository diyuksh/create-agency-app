name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm run lint
    - run: npx tsc --noEmit
    - name: Build Next.js
      run: npm run build
    - name: Run E2E Tests
      run: npm run test:e2e
